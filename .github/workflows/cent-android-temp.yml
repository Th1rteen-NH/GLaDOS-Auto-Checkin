name: Cent Android temp build
on:
  push:
    branches: [ cent-android-ci-temp ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Reconstruct project from Git history
        run: |
          set -euo pipefail
          : > /tmp/project.b64
          for i in 00 01 02 03 04 05 06 07 08; do
            sha=$(git log --all --grep="temporary Cent Android CI payload $i" --format=%H -1)
            test -n "$sha"
            echo "part $i <- $sha"
            git show "$sha:ci/project.b64.part$i" >> /tmp/project.b64
          done
          mkdir -p /tmp/cent-project
          base64 -d /tmp/project.b64 > /tmp/cent-project.tar.xz
          echo "archive sha256: $(sha256sum /tmp/cent-project.tar.xz | cut -d' ' -f1)"
          test "$(sha256sum /tmp/cent-project.tar.xz | cut -d' ' -f1)" = "c6429658913643fb455165cd9b39a5f7804b2e2a388aade631405cd9554cf88b"
          xz -t /tmp/cent-project.tar.xz
          tar -xJf /tmp/cent-project.tar.xz -C /tmp/cent-project
      - name: Android SDK diagnostic
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 2 -type d \( -name 'android-37' -o -name '36.0.0' -o -name '37.0.0' \) -print 2>/dev/null || true
      - name: Assemble debug APK
        working-directory: /tmp/cent-project
        run: gradle --stacktrace :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: cent-android-cleanroom-debug
          path: /tmp/cent-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
